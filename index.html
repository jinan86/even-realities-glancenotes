<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>GlanceNotes — companion</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        /* ER brand dark-theme surface (#232323) + Neutral-200 text (#E5E5E5). */
        background: #232323;
        color: #E5E5E5;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app { max-width: 560px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      h2 { font-size: 15px; margin: 20px 0 6px; }
      p, li { font-size: 14px; }
      #comp-status { color: #9be15d; }
      input {
        width: 100%; box-sizing: border-box; padding: 10px; margin: 4px 0;
        background: #333; color: #E5E5E5; border: 1px solid #555; border-radius: 6px;
        font: inherit;
      }
      button {
        padding: 10px 16px; margin: 4px 4px 4px 0;
        background: #3a7d2c; color: #fff; border: none; border-radius: 6px;
        font: inherit; cursor: pointer;
      }
      button.secondary { background: #444; }
      ul { padding-left: 20px; }
      li { margin: 6px 0; }
      li button { padding: 2px 10px; margin-left: 8px; font-size: 12px; }
      .answer { background: #2c2c2c; border-left: 3px solid #3a7d2c; padding: 10px; margin-top: 8px; }
      .hint { color: #aaa; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>GlanceNotes</h1>
      <p id="comp-status">Connecting to backend…</p>
      <p class="hint">Check the glasses display for today's tasks. Type below to ask your notes or add a task.</p>

      <h2>Today's tasks</h2>
      <ul id="comp-tasks"></ul>
      <button id="refresh-btn" class="secondary">Refresh</button>

      <h2>Ask your notes</h2>
      <input id="ask-input" type="text" placeholder="e.g. When is the Agentware kickoff?" autocomplete="off" />
      <button id="ask-btn">Ask</button>
      <div id="comp-answer" class="answer">Answers come from your Notion notes, never from thin air.</div>

      <h2>Add a task</h2>
      <input id="add-input" type="text" placeholder="e.g. Buy milk" autocomplete="off" />
      <button id="add-btn">Send to glasses</button>
      <p id="comp-add-status" class="hint">New tasks wait for one tap on G2 to confirm.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
